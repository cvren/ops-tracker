name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ops_tracker:ops_tracker@127.0.0.1:5434/ops_tracker?schema=public
  OPS_TRACKER_SESSION_COOKIE: ops-tracker-session
  OPS_TRACKER_SESSION_SECRET: change-this-secret-locally
  OPS_TRACKER_DEMO_EMAIL: reviewer@ops-tracker.local
  OPS_TRACKER_DEMO_PASSWORD: ChangeMe123!
  OPS_TRACKER_SECONDARY_EMAIL: coordinator@ops-tracker.local
  OPS_TRACKER_SECONDARY_PASSWORD: ChangeMe123!
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ops_tracker
          POSTGRES_USER: ops_tracker
          POSTGRES_PASSWORD: ops_tracker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ops_tracker -d ops_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare env file
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ops_tracker
          POSTGRES_USER: ops_tracker
          POSTGRES_PASSWORD: ops_tracker
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ops_tracker -d ops_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Prepare env file
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Seed demo data
        run: pnpm db:seed

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
